services:
  - type: web
    name: hockey-pool
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: hockey-pool-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: TICKET_PRICE_CENTS
        value: "300"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: hockey-pool-db
    plan: free
    databaseName: hockey_pool
    user: hockey_pool
